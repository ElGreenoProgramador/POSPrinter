org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
kotlin.code.style=official

# Workaround for a known AGP/Gradle race condition where two tasks (e.g.
# dataBindingMergeDependencyArtifacts and processResources) resolve the same
# configuration concurrently under parallel execution, and one mutates it
# after the other has already resolved it ("Cannot mutate the dependencies
# of configuration ... after the configuration was resolved"). Disabling
# parallel execution avoids the race. Safe to remove once you upgrade AGP
# (see build.gradle comment) past the versions affected by this bug.
org.gradle.parallel=false

# Give the Kotlin compile daemon enough heap and keep it isolated from stale
# state left over after a Gradle/AGP version bump - "Daemon compilation
# failed: null" is almost always a corrupted/stale kotlin daemon, not a
# real code error.
kotlin.daemon.jvmargs=-Xmx2048m
